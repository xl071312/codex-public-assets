name: Build Lumi Android APK

on:
  push:
    branches: [lumi-android-mvp]
    paths:
      - 'lumi_chunks/**'
      - '.github/workflows/lumi-android-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - name: Restore verified source tree
        run: |
          cat lumi_chunks/part*.b64 > /tmp/LumiDeskPet.b64
          test "$(wc -c < /tmp/LumiDeskPet.b64)" -eq 21868
          echo "7407c4be7fe27f6b3c71f7107b0389e75bfce883351cdb4cfe327243d6fbc93b  /tmp/LumiDeskPet.b64" | sha256sum -c -
          base64 -d /tmp/LumiDeskPet.b64 > /tmp/LumiDeskPet.zip
          echo "9eb0bb23ce02af69cd8d7e44b9e02ec672b07149b7950097a6e82d03e14bad6a  /tmp/LumiDeskPet.zip" | sha256sum -c -
          unzip -q /tmp/LumiDeskPet.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Build APK
        run: gradle -p LumiDeskPet :app:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LumiDeskPet-debug
          path: LumiDeskPet/app/build/outputs/apk/debug/app-debug.apk
