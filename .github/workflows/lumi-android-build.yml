name: Build Lumi Android APK

on:
  push:
    branches: [lumi-android-mvp]
    paths:
      - 'LumiDeskPet-source-v0.1.zip.b64'
      - '.github/workflows/lumi-android-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore source tree
        run: |
          base64 -d LumiDeskPet-source-v0.1.zip.b64 > /tmp/LumiDeskPet.zip
          unzip -q /tmp/LumiDeskPet.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: yes | sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Build APK
        run: gradle -p LumiDeskPet :app:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LumiDeskPet-debug
          path: LumiDeskPet/app/build/outputs/apk/debug/app-debug.apk
